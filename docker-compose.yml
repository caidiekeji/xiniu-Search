# xiniubot - Docker 编排 (单镜像: 内置 Meilisearch)
# 一个服务 = 完整系统: 搜索(5050) + 管理后台(8081) + 内置 Meilisearch(7700)
# 用法: docker compose up -d --build
# 可选: 在项目根创建 .env 覆盖 MEILI_MASTER_KEY
services:
  app:
    build: .
    container_name: xiniubot
    restart: unless-stopped
    ports:
      - "5050:5050"   # 搜索服务: 宿主机 5050 -> 容器内 5050
      - "8081:8081"   # 管理后台: 宿主机 8081 -> 容器内 8081
      - "7700:7700"   # 内置 Meilisearch: 宿主机 7700 -> 容器内 7700
    environment:
      XINIU_SEARCH_BACKEND: meili
      MEILI_HOST: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-xiniubot-change-me-master-key}
    volumes:
      - xiniubot_data:/app/data

volumes:
  xiniubot_data:
